global:
  scrape_interval: 45s # Tiempo entre chequeos
  scrape_timeout: 35s   # Tiempo máximo que espera Prometheus
scrape_configs:
  - job_name: 'camaras_ping'
    metrics_path: /probe
    params:
      module: [icmp_check]
    file_sd_configs:
      - files:
        - '/etc/prometheus/targets/camaras.json' # Aquí buscaremos las IPs
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115 # Dirección del exportador en la red de Docker
